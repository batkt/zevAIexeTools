[package]
name = "zev-detector"
version = "1.7.0"
edition = "2021"
description = "Zev Detector — Windows log / service / application activity and error detector"

# Everything the two binaries share. The service binary must stay free of GUI
# dependencies, so the split is a real library rather than a shared module.
[lib]
name = "zev_detector"
path = "src/lib.rs"

# The headless agent: the Windows service itself plus its management CLI.
[[bin]]
name = "zev-detector"
path = "src/main.rs"

# The desktop app people open. Separate binary so the service the SCM starts
# never loads a WebView.
[[bin]]
name = "zev-detector-ui"
path = "src/ui_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
fern = "0.6"
chrono = "0.4"
anyhow = "1"
once_cell = "1"
regex = "1"
sysinfo = "0.32"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
rfd = "0.15"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
    "Win32_System_Services",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
